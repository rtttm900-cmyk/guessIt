<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuessIt</title>

    <style>
        body {
            background: #151515;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
        }

        .game-card {
            background: #252525;
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
        }

        button {
            background: #5865F2;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 17px;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎮 GuessIt</h1>
        <h2>مرحباً بك في عالم التخمين!</h2>

        <p>اختر اللعبة التي تريد لعبها</p>

        <div class="game-card">
            <h2>🔤 تخمين الكلمات</h2>
            <p>اكتشف الكلمة من خلال التلميحات</p>
            <button onclick="location.href='words.html'">
                العب الآن
            </button>
        </div>

        <div class="game-card">
            <h2>🔢 تخمين الأرقام</h2>
            <p>حاول اكتشاف الرقم السري</p>
            <button onclick="location.href='numbers.html'">
                العب الآن
            </button>
        </div>

        <div class="game-card">
            <h2>♟️ الشطرنج</h2>
            <p>العب الشطرنج واستمتع بالمنافسة</p>
            <button onclick="location.href='chess.html'">
                العب الآن
            </button>
        </div>

    </div>

</body>
</html>
