<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuessIt - تخمين الكلمات</title>

    <style>
        body {
            background: #151515;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 25px;
        }

        .game {
            background: #252525;
            padding: 25px;
            border-radius: 15px;
            max-width: 420px;
            margin: auto;
        }

        input {
            padding: 12px;
            width: 85%;
            margin: 10px;
            border-radius: 8px;
            border: none;
            font-size: 17px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 7px;
            border: none;
            border-radius: 8px;
            background: #5865F2;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>🔤 تخمين الكلمات</h1>

        <p>النقاط: <span id="score">0</span></p>
        <p>المستوى: <span id="level">1</span></p>

        <hr>

        <p id="hint">التلميح:</p>

        <input
            type="text"
            id="guess"
            placeholder="اكتب إجابتك"
        >

        <br>

        <button onclick="checkGuess()">تأكيد الإجابة</button>

        <p id="message"></p>

        <p>
            المحاولات المتبقية:
            <span id="attempts">5</span>
        </p>

        <button onclick="newWord()">كلمة جديدة</button>

        <br>

        <button onclick="location.href='index.html'">
            العودة للرئيسية
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
